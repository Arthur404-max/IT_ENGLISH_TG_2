[package]
name = "it-english-lab"
version = "0.1.0"
edition = "2021"
description = "IT English Lab — тренажёр IT-английского"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
if-addrs = "0.15"
fs2 = "0.4"
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false }
# Direct dependency only so Cargo exposes the sys crate's `links` metadata
# (`DEP_LLAMA_GGML_CMAKE_DIR`) to build.rs. Features are unified with the
# transitive llama-cpp-2 dependency.
llama-cpp-sys-2 = { version = "0.1.161", optional = true, default-features = false }

[features]
default = []
embedded = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
