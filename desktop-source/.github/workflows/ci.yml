name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, smoke and API checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check build
        run: cargo check --locked

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Stage plain executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/it-english-lab.exe dist/it-english-lab.exe -Force

      - name: Run smoke test
        run: node tools/smoke_test.js --no-lan

      - name: Upload plain executable
        uses: actions/upload-artifact@v4
        with:
          name: it-english-lab-windows
          path: dist/it-english-lab.exe
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Edge E2E
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download plain executable
        uses: actions/download-artifact@v4
        with:
          name: it-english-lab-windows
          path: dist

      - name: Run Edge E2E test
        run: node tools/e2e_test.js

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/itelab-e2e-*
          if-no-files-found: ignore
          retention-days: 7
