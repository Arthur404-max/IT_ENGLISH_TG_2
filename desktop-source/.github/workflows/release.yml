name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for an unsigned dry-run package (not published)"
        required: true
        default: "v4.0.0-dev"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install GNU Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME } else { $env:INPUT_VERSION }
          if (-not $version) { throw "Release version is empty" }
          if ($version -notmatch '^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version must look like v4.0.0 or v4.0.0-rc.1: $version"
          }
          if (-not $version.StartsWith("v")) {
            $version = "v$version"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "value=$version"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build plain release
        shell: pwsh
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\it-english-lab.exe dist\it-english-lab.exe -Force

      - name: Build embedded release
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: .\build.ps1 -Embedded

      - name: Smoke plain
        run: node tools/smoke_test.js --no-lan

      - name: Smoke embedded
        shell: pwsh
        run: |
          $env:ITELAB_EXE = (Resolve-Path "dist\it-english-lab-embedded.exe").Path
          node tools/smoke_test.js --no-lan

      - name: Decode signing certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          if ($env:WINDOWS_PFX_BASE64) {
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            Add-Content -Path $env:GITHUB_OUTPUT -Value "pfx=$pfx"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "available=true"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "available=false"
          }

      - name: Package release
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.signing.outputs.pfx }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          VERSION: ${{ steps.version.outputs.value }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $arguments = @{ Version = $env:VERSION }
          if ($env:PFX_PATH) {
            $arguments.PfxPath = $env:PFX_PATH
            if ($env:PFX_PASSWORD) {
              $arguments.PfxPassword = $env:PFX_PASSWORD
            }
          }
          $require = ($env:REF_TYPE -eq "tag") -or [bool]$env:PFX_PATH
          if ($require) {
            $arguments.RequireSignature = $true
          }
          & .\tools\release.ps1 @arguments

      - name: Verify release archive
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SIGNED: ${{ steps.signing.outputs.available }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $zip = Join-Path "dist\release" "IT-English-Lab-$env:VERSION.zip"
          $expected = (Get-Content -LiteralPath "$zip.sha256" -Raw).Trim().Split()[0]
          $extract = Join-Path $env:RUNNER_TEMP "itelab-release-verify"
          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          $arguments = @{
            ZipPath = $zip
            ExpectedSha256 = $expected
            ExtractTo = $extract
          }
          if ($env:SIGNED -ne "true" -and $env:REF_TYPE -ne "tag") {
            $arguments.AllowUnsigned = $true
          }
          & .\tools\verify_release.ps1 @arguments

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: it-english-lab-release-${{ steps.version.outputs.value }}
          path: |
            dist/release/IT-English-Lab-${{ steps.version.outputs.value }}.zip
            dist/release/IT-English-Lab-${{ steps.version.outputs.value }}.zip.sha256
            dist/release/SHA256SUMS-release.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          if ($env:SIGNED -ne "true") {
            throw "A code-signing certificate is required to publish an official release"
          }
          $zip = Join-Path "dist\release" "IT-English-Lab-$env:VERSION.zip"
          $checksum = "$zip.sha256"
          $sums = Join-Path "dist\release" "SHA256SUMS-release.txt"
          $notes = @"
          Windows release: plain and embedded executables.

          Verify SHA256SUMS-release.txt and the Authenticode signature before updating.
          The application never accesses the private repository and does not auto-update.
          "@
          gh release create $env:VERSION $zip $checksum $sums `
            --title "IT English Lab $env:VERSION" `
            --notes $notes `
            --verify-tag

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          if (Test-Path -LiteralPath $pfx) {
            Remove-Item -LiteralPath $pfx -Force
          }
